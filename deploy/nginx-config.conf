# Nginx Configuration for Operion Backend
# Place this file at: /etc/nginx/sites-available/operion (Ubuntu)
# OR: /etc/nginx/conf.d/operion.conf (Amazon Linux)

server {
    listen 80;
    server_name your-domain.com;  # Replace with your domain or EC2 public IP
    
    # Increase timeouts for long-running API calls
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;
    
    # Increase client body size for file uploads
    client_max_body_size 10M;
    
    # Access and error logs
    access_log /var/log/nginx/operion_access.log;
    error_log /var/log/nginx/operion_error.log;
    
    # Proxy to Node.js backend
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Caching
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    
    # Health check endpoint (optional - for load balancers)
    location /health {
        proxy_pass http://localhost:3000/health;
        access_log off;
    }
}

